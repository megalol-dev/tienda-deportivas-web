# ==========================================
# APLICACIÓN
# ==========================================

spring.application.name=backend


# ==========================================
# CONEXIÓN A MARIADB
# ==========================================

spring.datasource.url=jdbc:mariadb://localhost:3306/tienda_deportivas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Durante el desarrollo Hibernate actualiza
# automáticamente la estructura de la BD
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Formatea las consultas SQL para facilitar su lectura
spring.jpa.properties.hibernate.format_sql=true

# Evita mantener abierta la sesión de Hibernate
# durante toda la petición HTTP
spring.jpa.open-in-view=false


# ==========================================
# SESIÓN
# ==========================================

# La sesión expira tras 30 minutos de inactividad
server.servlet.session.timeout=30m


# ==========================================
# COOKIE DE SESIÓN
# ==========================================

# JavaScript no puede acceder a JSESSIONID
server.servlet.session.cookie.http-only=true

# En desarrollo utilizamos HTTP
server.servlet.session.cookie.secure=false

# Política SameSite de la cookie
server.servlet.session.cookie.same-site=lax

# ==========================================
# STRIPE
# ==========================================

# La clave NO está escrita aquí.
# Spring la obtiene de la variable de entorno
# STRIPE_SECRET_KEY configurada en Windows.
stripe.secret-key=${STRIPE_SECRET_KEY}

# Clave utilizada para verificar que los webhooks
# recibidos proceden realmente de Stripe.
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# ==========================================
# MANEJO DE ERRORES
# ==========================================

# No expone excepciones internas en las respuestas HTTP.
spring.web.error.include-exception=false

# No expone el stack trace de Spring/Java al cliente.
spring.web.error.include-stacktrace=never

# No expone mensajes internos de excepciones.
spring.web.error.include-message=never

# No expone detalles internos de errores de validación.
spring.web.error.include-binding-errors=never

